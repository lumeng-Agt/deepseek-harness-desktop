<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; script-src 'self';" />
<title>DeepSeek Harness</title>
<style>
  html,body{margin:0;height:100%;background:#101418;color:#c9d1d9;
    font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;}
  .box{text-align:center;max-width:420px;}
  .h{font-size:17px;font-weight:600;margin-bottom:8px;}
  .s{font-size:13px;color:#8b949e;line-height:1.6;}
  .diag{margin:16px auto 0;padding:10px 12px;max-width:100%;overflow:auto;text-align:left;
    border:1px solid #263241;border-radius:6px;background:#0d1117;color:#8b949e;
    font:11px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;}
  .btn{margin-top:20px;padding:8px 20px;border:0;border-radius:6px;background:#4d6bfe;
    color:#fff;font-size:14px;cursor:pointer;}
  .copy{margin:20px 0 0 8px;padding:8px 12px;border:1px solid #303b4a;border-radius:6px;
    background:transparent;color:#c9d1d9;font-size:13px;cursor:pointer;}
  button:disabled{cursor:wait;opacity:.65;}
</style>
</head>
<body>
  <div class="box">
    <div class="h">启动失败</div>
    <div class="s" id="message">无法连接到 DeepSeek Harness 服务。<br/>请检查安装或稍后重试。</div>
    <pre class="diag" id="diagnostics" aria-live="polite">正在读取诊断信息…</pre>
    <button class="btn" id="retry">重试</button>
    <button class="copy" id="copy" type="button">复制诊断信息</button>
  </div>
<script src="error.js"></script>
</body>
</html>
