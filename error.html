<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>DeepSeek Harness</title>
<style>
  html,body{margin:0;height:100%;background:#101418;color:#c9d1d9;
    font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;}
  .box{text-align:center;max-width:420px;}
  .h{font-size:17px;font-weight:600;margin-bottom:8px;}
  .s{font-size:13px;color:#8b949e;line-height:1.6;}
  .btn{margin-top:20px;padding:8px 20px;border:0;border-radius:6px;background:#4d6bfe;
    color:#fff;font-size:14px;cursor:pointer;}
</style>
</head>
<body>
  <div class="box">
    <div class="h">启动失败</div>
    <div class="s" id="message">无法连接到 DeepSeek Harness 服务。<br/>请检查安装或稍后重试。</div>
    <button class="btn" id="retry">重试</button>
  </div>
<script>
  window.setStartupError = function (message) {
    var node = document.getElementById('message');
    if (node && message) node.textContent = message;
  };
  document.getElementById('retry').addEventListener('click', function () {
    var button = this;
    button.disabled = true;
    button.textContent = '重试中…';
    if (window.dshApp && window.dshApp.retry) window.dshApp.retry().catch(function () { button.disabled = false; button.textContent = '重试'; });
  });
</script>
</body>
</html>
