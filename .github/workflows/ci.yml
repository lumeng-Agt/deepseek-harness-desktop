name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm audit --audit-level=high

  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run pack
      - name: Create portable archive
        shell: pwsh
        run: |
          Compress-Archive -Path 'release/DeepSeek Harness Desktop-win32-x64' -DestinationPath 'release/DeepSeek-Harness-Desktop-win32-x64.zip' -Force
          (Get-FileHash 'release/DeepSeek-Harness-Desktop-win32-x64.zip' -Algorithm SHA256).Hash | Out-File 'release/DeepSeek-Harness-Desktop-win32-x64.zip.sha256' -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-Desktop-win32-x64
          path: |
            release/DeepSeek-Harness-Desktop-win32-x64.zip
            release/DeepSeek-Harness-Desktop-win32-x64.zip.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DeepSeek-Harness-Desktop-win32-x64
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
