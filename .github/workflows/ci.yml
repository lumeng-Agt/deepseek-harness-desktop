name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

concurrency:
  group: dshgui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm audit --audit-level=high

  windows-package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run pack
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath 'package.json' -Raw -Encoding utf8 | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag $env:GITHUB_REF_NAME does not match package version v$version"
          }
      - name: Create portable archive
        shell: pwsh
        run: |
          Compress-Archive -Path 'release/DeepSeek Harness Desktop-win32-x64' -DestinationPath 'release/DeepSeek-Harness-Desktop-win32-x64.zip' -Force
          (Get-FileHash 'release/DeepSeek-Harness-Desktop-win32-x64.zip' -Algorithm SHA256).Hash | Out-File 'release/DeepSeek-Harness-Desktop-win32-x64.zip.sha256' -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-Desktop-win32-x64
          retention-days: 14
          path: |
            release/DeepSeek-Harness-Desktop-win32-x64.zip
            release/DeepSeek-Harness-Desktop-win32-x64.zip.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DeepSeek-Harness-Desktop-win32-x64
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
